name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Основной прогон: unit + integration на трёх платформах.
  # Флаги памяти и потоков берутся из config.nims, поэтому просто nimble test.
  # ---------------------------------------------------------------------------
  test:
    name: unit + integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          # Точная версия, а не '2.2.x': ветка 'x' заставляет action дёргать
          # GitHub API (refs/tags) без токена -> 401 -> падение jq в action.
          # С точной версией action просто качает релиз с nim-lang.org.
          nim-version: '2.2.12'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Показать версию Nim
        run: nim --version

      - name: nimble test
        run: nimble test

  # ---------------------------------------------------------------------------
  # Release-сборка с LTO: проверяет, что ядро собирается теми же флагами,
  # с которыми оно будет поставляться (см. config.nims и euterpia.nimble).
  # ---------------------------------------------------------------------------
  release:
    name: release build with LTO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: nimble buildRelease
        run: nimble buildRelease

  # ---------------------------------------------------------------------------
  # miniaudio-бэкенд (issue #31): здесь РЕАЛЬНО собирается и линкуется TU
  # miniaudio (adapters/miniaudio/miniaudio_impl.c, вендоренный 0.11.25).
  #
  # Это единственное место, где проверяется компиляция C-шима. На раннере
  # без звуковой подсистемы тест печатает SKIP и всё равно зелёный, но
  # обязательно проверяет, что отсутствие устройства даёт код ошибки, а не
  # падение. Запускается только на Linux: для Windows/macOS нужен другой
  # набор фреймворков линковки (отдельная задача, если понадобится).
  # ---------------------------------------------------------------------------
  miniaudio:
    name: miniaudio backend smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: nimble miniaudioSmoke
        run: nimble miniaudioSmoke

  # ---------------------------------------------------------------------------
  # Архитектурные guard'ы границ слоёв (MANIFEST §40, §41, §42).
  #
  # Это executable-версия критериев приёмки issue #29: конкретный формат
  # плагинов и конкретный аудио-бэкенд не имеют права протечь в Core.
  # Guard дешёвый (только grep), поэтому он блокирует merge.
  # ---------------------------------------------------------------------------
  architecture:
    name: architecture guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Core не знает о формате плагинов (plugin_api, #29)
        run: |
          if grep -rn "clap\|Clap" core/ nodes/sdk/; then
            echo "::error::CLAP-типы протекли в core/ или nodes/sdk/ (§40, §42)"
            exit 1
          fi
          if grep -rn "clap_entry\|clap_plugin_entry" core/; then
            echo "::error::clap_entry протёк в core/ (#29)"
            exit 1
          fi

      - name: Core знает только audio_backend_api, а не конкретную библиотеку (#31)
        run: |
          # Проверяется КОД: символы конкретной библиотеки, а не проза.
          if grep -rnE "miniaudio\.[hc]|MINIAUDIO_IMPLEMENTATION|ma_[a-z0-9]+_" core/; then
            echo "::error::конкретная аудиобиблиотека протекла в core/ (§8, §41)"
            exit 1
          fi

      - name: Realtime-путь проверяется компилятором на gcsafe (#16)
        run: |
          # Прагма `rt` — это контракт realtime-пути: `raises: []` + `gcsafe`.
          # Если из неё пропадёт `gcsafe`, вся проверка GC-чистоты audio-пути
          # молча выключится (ровно та проблема, из-за которой заводился #16).
          if ! grep -qE '\{\.pragma: rt,[^}]*gcsafe' core/audio_engine.nim; then
            echo "::error::прагма rt потеряла gcsafe: RT-путь перестал проверяться (#16)"
            exit 1
          fi
          # cast(gcsafe) — заглушка вместо доказательства, запрещён.
          if grep -rn "cast(gcsafe)" --include=*.nim .; then
            echo "::error::cast(gcsafe) запрещён: нужен настоящий аудит (#16)"
            exit 1
          fi
          # Callback-типы аудио-пути обязаны быть gcsafe: именно через них
          # компилятор видит косвенные вызовы в audio-потоке.
          python3 - <<'PY'
          import sys

          NEED = {
              "core/node_interface.nim": ["ProcessProc"],
              "core/compiled_pipeline.nim": ["PipelineRenderProc", "BindMasterProc",
                                             "ApplyParamProc", "PipelineDestroyProc"],
              "core/audio_backend_api.nim": ["AudioRenderProc", "AudioStatusProc"],
              "core/dsp_scheduler.nim": ["DspTaskProc"],
              "nodes/sdk/node_api.nim": ["NodeProcessProc"],
          }

          bad = []
          for path, types in NEED.items():
              lines = open(path, encoding="utf-8").read().split("\n")
              for t in types:
                  ok = False
                  for i, line in enumerate(lines):
                      if not line.strip().startswith(t + "*"):
                          continue
                      chunk = []
                      for j in range(i, min(i + 30, len(lines))):
                          chunk.append(lines[j])
                          if "{." in lines[j]:
                              ok = "gcsafe" in "\n".join(chunk)
                              break
                      break
                  if not ok:
                      bad.append(path + ":" + t)

          if bad:
              print("::error::callback-типы без gcsafe: " + ", ".join(bad))
              sys.exit(1)
          print("ok: callback-типы аудио-пути помечены gcsafe")
          PY


        run: |
          # Критерий приёмки #32 в исполняемом виде. Проверяются СИМВОЛЫ
          # конкретных библиотек (ma_/Pa_/jack_/snd_/clap_entry): именно они
          # означают реальную зависимость. Упоминание библиотеки в прозе —
          # докстрока audio_backend_api.nim перечисляет бэкенды по §8 —
          # зависимостью не является.
          if grep -rnE "ma_[a-z0-9]+_|Pa_[A-Za-z]+\(|jack_[a-z]+_|snd_[a-z]+_|clap_entry" core/; then
            echo "::error::символы конкретной аудиобиблиотеки протекли в core/ (#32)"
            exit 1
          fi
          # И выбор бэкенда должен идти через реестр, а не через жёсткий
          # import адаптера из Core.
          if grep -rnE "import[[:space:]]+.*(audio_backend_portaudio|audio_backend_miniaudio|midi_backend_rtmidi)" core/; then
            echo "::error::Core импортирует адаптер напрямую (§27, §93)"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # TSan: гонки в dsp_scheduler / ipc_bus / memory_pool / ring_buffer.
  #
  # Прогон гоняет весь unit-набор, включая стресс ring_buffer (issue #37):
  # миллион push/pop в двух потоках и два producers в MPSC.
  #
  # Job блокирует merge. Чтобы он мог работать, SIMD-диспетчеризация
  # (target_clones/IFUNC) в C-ядрах отключается под санитайзером — см.
  # nodes/builtin/csrc/eut_dsp.h. IFUNC-резолверы исполняются загрузчиком
  # до готовности рантайма TSan и роняли процесс SIGSEGV.
  # ---------------------------------------------------------------------------
  tsan:
    name: thread sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и прогон под TSan
        run: |
          mkdir -p build
          nim c -r --hints:off \
            --passC:-fsanitize=thread --passC:-g \
            --passL:-fsanitize=thread \
            --out:build/euterpia_unit_tests_tsan \
            tests/unit/all_tests.nim

  # ---------------------------------------------------------------------------
  # UBSan: неопределённое поведение на том же unit-наборе (issue #13).
  #
  # Прогон вынесен в nimble-цель `nimble ubsan`, чтобы у локального
  # воспроизведения и CI был один и тот же запуск. `-fno-sanitize-recover=all`
  # превращает любое срабатывание в ненулевой код возврата — иначе UBSan
  # печатает предупреждение и продолжает, и job остаётся зелёным.
  #
  # ВАЖНО: у каждого санитайзера свой `--nimcache`. При общем кэше объектные
  # файлы перемешиваются, и линковка падает на символах «чужого» санитайзера
  # (__asan_report_store4 в UBSan-прогоне и наоборот). Санитайзер-джобы не
  # должны делить кэш ни с чем и не должны запускаться параллельно.
  #
  # Про IFUNC (target_clones) в C-ядрах: он отключается только по
  # __SANITIZE_THREAD__, а у GCC нет макроса для UBSan, поэтому здесь
  # SIMD-диспетчеризация остаётся включённой. Прогон зелёный; если UBSan
  # начнёт падать на резолверах — добавить явный -DEUT_NO_SIMD_DISPATCH.
  # ---------------------------------------------------------------------------
  ubsan:
    name: undefined behavior sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: nimble ubsan
        run: nimble ubsan

  # ---------------------------------------------------------------------------
  # ASan: выход за границы и use-after-free (issue #13).
  #
  # `nimble asan` выставляет detect_leaks=0 намеренно: ядро держит
  # shared-арены (memory_pool, audio-арены пайплайна) на весь срок жизни
  # процесса, и LeakSanitizer считал бы их утечками. Проверяются именно
  # переполнения/висячие ссылки — ASan дал доказательство дефекта #64
  # (OOB-чтение gainCurve в компрессоре).
  # ---------------------------------------------------------------------------
  asan:
    name: address sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: nimble asan
        run: nimble asan

  # ---------------------------------------------------------------------------
  # Сквозной CLAP-тест (#53): mock-плагин из tests/mock/ собирается в
  # разделяемую библиотеку (nim c --app:lib) и прогоняется через адаптер
  # целиком: load → enumerate → instantiate → activate → process → params →
  # state, включая request_callback → on_main_thread и round-trip состояния
  # через core/project.
  #
  # Только Linux: ABI разделяемых библиотек и упаковка символьной таблицы
  # отличаются на Windows/macOS (для них нужен свой джоб).
  # ---------------------------------------------------------------------------
  clap:
    name: clap host integration (mock plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: nimble clapMock
        run: nimble clapMock


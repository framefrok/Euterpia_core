name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Основной прогон: unit + integration на трёх платформах.
  # Флаги памяти и потоков берутся из config.nims, поэтому просто nimble test.
  # ---------------------------------------------------------------------------
  test:
    name: unit + integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      # Тулчейн из ГОТОВОГО бинаря + кэш (issue #42): setup-nim-action
      # на macOS собирает Nim из исходников (~5 мин), потому что его
      # install_nim.sh берёт предсобранный tarball только для Linux+x86_64.
      - name: Setup nim
        uses: ./.github/actions/setup-nim
        with:
          # Точная версия, а не '2.2.x'/'stable': предсобранный бинарь
          # качается по имени файла, и ветка 'x' его не адресует.
          nim-version: '2.2.12'

      - name: Показать версию Nim
        run: nim --version

      - name: nimble test
        run: nimble test

  # ---------------------------------------------------------------------------
  # Release-сборка с LTO: проверяет, что ядро собирается теми же флагами,
  # с которыми оно будет поставляться (см. config.nims и euterpia.nimble).
  # ---------------------------------------------------------------------------
  release:
    name: release build with LTO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup nim
        uses: ./.github/actions/setup-nim
        with:
          nim-version: '2.2.12'

      - name: nimble buildRelease
        run: nimble buildRelease

  # -----------------------------------------------------------------------
  # Realtime-guard (issue #11): оба режима сборки должны быть зелёными.
  #
  # `nimble test` собирает unit-набор в debug — там `rtGuardEnabled` включён
  # (config.nims), и `rtAssert*` реально падают на нарушении. Этот джоб
  # закрывает вторую половину критерия приёмки: в release те же проверки
  # обязаны компилироваться в пустоту, то есть НЕ ронять процесс и НЕ
  # растить счётчики. Без отдельного джоба опечатка в `when defined(...)`
  # тихо выключила бы guard в release и никто бы не заметил: тесты в debug
  # продолжали бы проходить.
  # -----------------------------------------------------------------------
  rtguard:
    name: realtime guard (debug + release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup nim
        uses: ./.github/actions/setup-nim
        with:
          nim-version: '2.2.12'

      - name: Debug — guard включён и ловит нарушения
        run: |
          mkdir -p build
          nim c -r --hints:off --out:build/rtguard_debug \
            tests/unit/all_tests.nim

      - name: Release — guard скомпилирован в пустоту
        run: |
          nim c -r --hints:off -d:release --out:build/rtguard_release \
            tests/unit/all_tests.nim

      - name: Guard действительно выключен в release
        run: |
          # Проверка на уровне строк бинаря. Маркер EUT_RT_GUARD_VIOLATION
          # существует ТОЛЬКО в текстах doAssert, а они компилируются лишь
          # при rtGuardEnabled. Раньше здесь искалась подстрока "rt_guard:",
          # но она присутствует и в release — как часть имени символа
          # `atmtest_rt_guarddotnim_Init000`, то есть проверка была бы
          # всегда зелёной и ничего не проверяла.
          if strings build/rtguard_release | grep -q "EUT_RT_GUARD_VIOLATION"; then
            echo "::error::rt_guard попал в release-сборку: overhead должен быть 0 (#11)"
            exit 1
          fi
          echo "ok: rt_guard вырезан из release"

      - name: Guard включён в debug по умолчанию
        run: |
          if ! strings build/rtguard_debug | grep -q "EUT_RT_GUARD_VIOLATION"; then
            echo "::error::rt_guard выключен в debug: нарушения не ловятся (#11)"
            exit 1
          fi
          echo "ok: rt_guard активен в debug"

  # ---------------------------------------------------------------------------
  # miniaudio-бэкенд (issue #31): здесь РЕАЛЬНО собирается и линкуется TU
  # miniaudio (adapters/miniaudio/miniaudio_impl.c, вендоренный 0.11.25).
  #
  # Это единственное место, где проверяется компиляция C-шима. На раннере
  # без звуковой подсистемы тест печатает SKIP и всё равно зелёный, но
  # обязательно проверяет, что отсутствие устройства даёт код ошибки, а не
  # падение. Запускается только на Linux: для Windows/macOS нужен другой
  # набор фреймворков линковки (отдельная задача, если понадобится).
  # ---------------------------------------------------------------------------
  miniaudio:
    name: miniaudio backend smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup nim
        uses: ./.github/actions/setup-nim
        with:
          nim-version: '2.2.12'

      - name: nimble miniaudioSmoke
        run: nimble miniaudioSmoke

  # ---------------------------------------------------------------------------
  # CLI (issue #88): сборка бинаря и smoke-тест контракта — коды возврата,
  # разделение stdout/stderr, детерминизм вывода, машинный формат (`--json`),
  # `doctor` (#105) и автодополнение (#259).
  #
  # Раннер без аудио, MIDI и плагинов — это и есть проверка критерия #105
  # «на машине без звука команда честно сообщает о недоступном и не падает».
  # Только Linux: CLI линкует адаптер miniaudio, а его сборка на Windows и
  # macOS требует отдельных фреймворков линковки (#52).
  # ---------------------------------------------------------------------------
  cli:
    name: cli smoke (build + contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup nim
        uses: ./.github/actions/setup-nim
        with:
          nim-version: '2.2.12'

      - name: nimble cliSmoke
        run: nimble cliSmoke

  # ---------------------------------------------------------------------------
  # Инспектор аудио (issue #290): эталонная пьеса собирается ТОЛЬКО CLI и
  # проверяется на дефекты. Это executable-версия критерия #275 «звучит как
  # задумано, а не просто не падает»: ошибки (клиппинг, провалы, жужжание,
  # NaN) блокируют merge.
  # ---------------------------------------------------------------------------
  analyze:
    name: audio inspector (reference render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup nim
        uses: ./.github/actions/setup-nim
        with:
          nim-version: '2.2.12'

      - name: Build CLI
        run: nimble cli

      - name: Assemble and render reference pieces (#275, #295)
        run: |
          ./compositions/neo-romantic/build.sh
          ./compositions/dark-fantasy/build.sh

      - name: Inspect audio for defects (#290)
        run: |
          ./build/euterpia analyze compositions/neo-romantic/ensemble.wav --fail-on error
          ./build/euterpia analyze compositions/dark-fantasy/ensemble.wav --fail-on error

  # ---------------------------------------------------------------------------
  # Архитектурные guard'ы границ слоёв (MANIFEST §40, §41, §42).
  #
  # Это executable-версия критериев приёмки issue #29: конкретный формат
  # плагинов и конкретный аудио-бэкенд не имеют права протечь в Core.
  # Guard дешёвый (только grep), поэтому он блокирует merge.
  # ---------------------------------------------------------------------------
  architecture:
    name: architecture guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Core не знает о CLI, CLI — только публичные API ядра (#88)
        run: |
          # Направление зависимостей: Core <- Nodes <- CLI (§19-21, §27).
          # Проверяются все слои ниже CLI: ядро, ноды и Commons о CLI не знают.
          if grep -rnE "cli/" core/ nodes/ commons/; then
            echo "::error::CLI протёк в ядро: Core не должен знать о CLI (§20)"
            exit 1
          fi

          # CLI не тянет внутренние модули ядра: только публичные API
          # (контракты бэкендов, logger, проект). Регистрация фабрик
          # адаптеров — единственное разрешённое касание адаптеров (§20, #88).
          internal='audio_engine|dsp_scheduler|compiled_pipeline|graph_compiler|memory_pool|rt_guard|ipc_bus|audio_recorder|node_interface|param_registry|waveform_cache'
          if grep -rnE "import[[:space:]]+($internal)\b" cli/ cli.nim; then
            echo "::error::CLI импортирует внутренности Core вместо публичного API (§20, #88)"
            exit 1
          fi

      - name: CLI не линкует dynlib-адаптеры (#105)
        run: |
          # `{.dynlib.}` резолвит символы внешней библиотеки в инициализации
          # модуля: импорт такого адаптера роняет процесс ДО main(), поэтому
          # `doctor` проверяет такие библиотеки пробой dlopen, а не импортом.
          # Проверено на adapters/rtmidi без librtmidi: вывод
          # «could not load: librtmidi.so» до первой строки кода.
          if grep -rnE "import[[:space:]].*(backend_portaudio|backend_rtmidi)" cli/ cli.nim; then
            echo "::error::CLI импортирует dynlib-адаптер: без библиотеки процесс упадёт до main() (#105)"
            exit 1
          fi
          echo "ok: CLI линкует только статически собранные адаптеры"

      - name: Команды проекта не создают движок и не открывают устройство (#89)
        run: |
          # Критерий #89 «команды не создают движок и не открывают устройство»
          # проверяется статически: init/project — чистый I/O над форматом
          # проекта (core/project.nim). Импорт движка, планировщика или
          # реестра бэкендов означал бы, что команда проекта умеет ходить в
          # устройство в обход backend manager (§20).
          if grep -nE "import[[:space:]].*(audio_engine|dsp_scheduler|backend_manager|backend_registry|audio_backend_api|audio_recorder)" cli/cmd_project.nim; then
            echo "::error::команды проекта тянут движок или устройства (#89, §20)"
            exit 1
          fi
          echo "ok: init/project работают только с форматом проекта"

      - name: Core не знает о формате плагинов (plugin_api, #29)
        run: |
          if grep -rn "clap\|Clap" core/ nodes/sdk/; then
            echo "::error::CLAP-типы протекли в core/ или nodes/sdk/ (§40, §42)"
            exit 1
          fi
          if grep -rn "clap_entry\|clap_plugin_entry" core/; then
            echo "::error::clap_entry протёк в core/ (#29)"
            exit 1
          fi

      - name: Core знает только audio_backend_api, а не конкретную библиотеку (#31)
        run: |
          # Проверяется КОД: символы конкретной библиотеки, а не проза.
          if grep -rnE "miniaudio\.[hc]|MINIAUDIO_IMPLEMENTATION|ma_[a-z0-9]+_" core/; then
            echo "::error::конкретная аудиобиблиотека протекла в core/ (§8, §41)"
            exit 1
          fi

      - name: Realtime-путь проверяется компилятором на gcsafe (#16)
        run: |
          # Прагма `rt` — это контракт realtime-пути: `raises: []` + `gcsafe`.
          # Если из неё пропадёт `gcsafe`, вся проверка GC-чистоты audio-пути
          # молча выключится (ровно та проблема, из-за которой заводился #16).
          if ! grep -qE '\{\.pragma: rt,[^}]*gcsafe' core/audio_engine.nim; then
            echo "::error::прагма rt потеряла gcsafe: RT-путь перестал проверяться (#16)"
            exit 1
          fi
          # cast(gcsafe) — заглушка вместо доказательства, запрещён.
          if grep -rn "cast(gcsafe)" --include=*.nim .; then
            echo "::error::cast(gcsafe) запрещён: нужен настоящий аудит (#16)"
            exit 1
          fi
          # Callback-типы аудио-пути обязаны быть gcsafe: именно через них
          # компилятор видит косвенные вызовы в audio-потоке.
          python3 - <<'PY'
          import sys

          NEED = {
              "core/node_interface.nim": ["ProcessProc"],
              "core/compiled_pipeline.nim": ["PipelineRenderProc", "BindMasterProc",
                                             "ApplyParamProc", "PipelineDestroyProc"],
              "core/audio_backend_api.nim": ["AudioRenderProc", "AudioStatusProc"],
              "core/dsp_scheduler.nim": ["DspTaskProc"],
              "nodes/sdk/node_api.nim": ["NodeProcessProc"],
          }

          bad = []
          for path, types in NEED.items():
              lines = open(path, encoding="utf-8").read().split("\n")
              for t in types:
                  ok = False
                  for i, line in enumerate(lines):
                      if not line.strip().startswith(t + "*"):
                          continue
                      chunk = []
                      for j in range(i, min(i + 30, len(lines))):
                          chunk.append(lines[j])
                          if "{." in lines[j]:
                              ok = "gcsafe" in "\n".join(chunk)
                              break
                      break
                  if not ok:
                      bad.append(path + ":" + t)

          if bad:
              print("::error::callback-типы без gcsafe: " + ", ".join(bad))
              sys.exit(1)
          print("ok: callback-типы аудио-пути помечены gcsafe")
          PY

      # Отдельный шаг: критерий приёмки #32 в исполняемом виде.
      #
      # Раньше это был НЕ отдельный шаг: при интеграции ветки #16 потерялась
      # строка `- name:`, и два `run:` оказались в одном шаге job
      # `architecture`. GitHub отвергает YAML с дублирующимся ключом, поэтому
      # workflow не компилировался и ВСЕ прогоны падали за 0s с 0 джобов
      # (issue #249). Имя шага восстановлено — ровно одно `run:` на шаг.
      - name: Core выбирает бэкенды по имени, а не по библиотеке (#32)
        run: |
          # Критерий приёмки #32 в исполняемом виде. Проверяются СИМВОЛЫ
          # конкретных библиотек (ma_/Pa_/jack_/snd_/clap_entry): именно они
          # означают реальную зависимость. Упоминание библиотеки в прозе —
          # докстрока audio_backend_api.nim перечисляет бэкенды по §8 —
          # зависимостью не является.
          if grep -rnE "ma_[a-z0-9]+_|Pa_[A-Za-z]+\(|jack_[a-z]+_|snd_[a-z]+_|clap_entry" core/; then
            echo "::error::символы конкретной аудиобиблиотеки протекли в core/ (#32)"
            exit 1
          fi
          # И выбор бэкенда должен идти через реестр, а не через жёсткий
          # import адаптера из Core.
          if grep -rnE "import[[:space:]]+.*(audio_backend_portaudio|audio_backend_miniaudio|midi_backend_rtmidi)" core/; then
            echo "::error::Core импортирует адаптер напрямую (§27, §93)"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # TSan: гонки в dsp_scheduler / ipc_bus / memory_pool / ring_buffer.
  #
  # Прогон гоняет весь unit-набор, включая стресс ring_buffer (issue #37):
  # миллион push/pop в двух потоках и два producers в MPSC.
  #
  # Job блокирует merge. Чтобы он мог работать, SIMD-диспетчеризация
  # (target_clones/IFUNC) в C-ядрах отключается под санитайзером — см.
  # nodes/builtin/csrc/eut_dsp.h. IFUNC-резолверы исполняются загрузчиком
  # до готовности рантайма TSan и роняли процесс SIGSEGV.
  # ---------------------------------------------------------------------------
  tsan:
    name: thread sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup nim
        uses: ./.github/actions/setup-nim
        with:
          nim-version: '2.2.12'

      - name: Сборка и прогон под TSan
        run: |
          mkdir -p build
          nim c -r --hints:off \
            --passC:-fsanitize=thread --passC:-g \
            --passL:-fsanitize=thread \
            --out:build/euterpia_unit_tests_tsan \
            tests/unit/all_tests.nim

  # ---------------------------------------------------------------------------
  # UBSan: неопределённое поведение на том же unit-наборе (issue #13).
  #
  # Прогон вынесен в nimble-цель `nimble ubsan`, чтобы у локального
  # воспроизведения и CI был один и тот же запуск. `-fno-sanitize-recover=all`
  # превращает любое срабатывание в ненулевой код возврата — иначе UBSan
  # печатает предупреждение и продолжает, и job остаётся зелёным.
  #
  # ВАЖНО: у каждого санитайзера свой `--nimcache`. При общем кэше объектные
  # файлы перемешиваются, и линковка падает на символах «чужого» санитайзера
  # (__asan_report_store4 в UBSan-прогоне и наоборот). Санитайзер-джобы не
  # должны делить кэш ни с чем и не должны запускаться параллельно.
  #
  # Про IFUNC (target_clones) в C-ядрах: он отключается только по
  # __SANITIZE_THREAD__, а у GCC нет макроса для UBSan, поэтому здесь
  # SIMD-диспетчеризация остаётся включённой. Прогон зелёный; если UBSan
  # начнёт падать на резолверах — добавить явный -DEUT_NO_SIMD_DISPATCH.
  # ---------------------------------------------------------------------------
  ubsan:
    name: undefined behavior sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup nim
        uses: ./.github/actions/setup-nim
        with:
          nim-version: '2.2.12'

      - name: nimble ubsan
        run: nimble ubsan

  # ---------------------------------------------------------------------------
  # ASan: выход за границы и use-after-free (issue #13).
  #
  # `nimble asan` выставляет detect_leaks=0 намеренно: ядро держит
  # shared-арены (memory_pool, audio-арены пайплайна) на весь срок жизни
  # процесса, и LeakSanitizer считал бы их утечками. Проверяются именно
  # переполнения/висячие ссылки — ASan дал доказательство дефекта #64
  # (OOB-чтение gainCurve в компрессоре).
  # ---------------------------------------------------------------------------
  asan:
    name: address sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup nim
        uses: ./.github/actions/setup-nim
        with:
          nim-version: '2.2.12'

      - name: nimble asan
        run: nimble asan

  # ---------------------------------------------------------------------------
  # Сквозной CLAP-тест (#53): mock-плагин из tests/mock/ собирается в
  # разделяемую библиотеку (nim c --app:lib) и прогоняется через адаптер
  # целиком: load → enumerate → instantiate → activate → process → params →
  # state, включая request_callback → on_main_thread и round-trip состояния
  # через core/project.
  #
  # Только Linux: ABI разделяемых библиотек и упаковка символьной таблицы
  # отличаются на Windows/macOS (для них нужен свой джоб).
  # ---------------------------------------------------------------------------
  clap:
    name: clap host integration (mock plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup nim
        uses: ./.github/actions/setup-nim
        with:
          nim-version: '2.2.12'

      - name: nimble clapMock
        run: nimble clapMock

